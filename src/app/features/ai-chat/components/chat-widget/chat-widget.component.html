@if (visible()) {
  @if (chat.isOpen()) {
    <div
      class="chat-panel fixed inset-0 z-[85] sm:inset-auto sm:bottom-24 sm:right-6 sm:h-[40rem] sm:max-h-[calc(100dvh-7rem)] sm:w-[26rem]"
      role="dialog"
      aria-label="CareHub AI assistant"
    >
      <app-chat-window (closed)="chat.close()" />
    </div>
  }

  <button
    type="button"
    class="fab fixed bottom-4 right-4 z-[80] sm:bottom-6 sm:right-6"
    [class.fab-hidden-mobile]="chat.isOpen()"
    [attr.aria-expanded]="chat.isOpen()"
    [attr.aria-label]="chat.isOpen() ? 'Close CareHub AI' : 'Open CareHub AI'"
    (click)="chat.toggle()"
  >
    @if (chat.isOpen()) {
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
    } @else {
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4L12 3zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9L18 15z" />
      </svg>
      <span class="hidden text-sm font-semibold sm:inline">Ask CareHub AI</span>
    }
  </button>
}
