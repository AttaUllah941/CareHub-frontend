<nav class="flex h-full flex-col bg-white" aria-label="Conversation history">
  <div class="border-b border-slate-100 p-3">
    <button type="button" class="btn-clinical btn-sm w-full" (click)="newChat.emit()">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      New chat
    </button>
  </div>

  <div class="min-h-0 flex-1 overflow-y-auto p-2">
    @if (loading() && conversations().length === 0) {
      <div class="space-y-2 p-1" aria-busy="true">
        <span class="sr-only">Loading conversations…</span>
        @for (row of skeletonRows; track row) {
          <div class="rounded-xl border border-slate-100 p-3">
            <div class="skeleton h-3.5 w-3/4"></div>
            <div class="skeleton mt-2 h-3 w-1/3"></div>
          </div>
        }
      </div>
    } @else if (conversations().length === 0) {
      <div class="px-4 py-10 text-center">
        <p class="text-sm font-semibold text-slate-700">No conversations yet</p>
        <p class="mt-1 text-xs text-slate-500">Your chats will appear here.</p>
      </div>
    } @else {
      <ul class="space-y-1">
        @for (conversation of conversations(); track conversation.id) {
          <li class="group relative">
            <button
              type="button"
              class="w-full rounded-xl px-3 py-2.5 pr-10 text-left transition-colors hover:bg-slate-50"
              [class.bg-brand-50]="conversation.id === activeId()"
              [attr.aria-current]="conversation.id === activeId() ? 'true' : null"
              (click)="selected.emit(conversation.id)"
            >
              <span class="block truncate text-sm font-semibold text-slate-800">{{ conversation.title }}</span>
              <span class="block text-xs text-slate-500">{{ when(conversation.lastMessageAt) }}</span>
            </button>
            <button
              type="button"
              class="absolute right-1.5 top-1/2 -translate-y-1/2 rounded-lg p-2 text-slate-400 opacity-100 transition hover:bg-red-50 hover:text-red-600 sm:opacity-0 sm:group-hover:opacity-100 sm:focus-visible:opacity-100"
              [attr.aria-label]="'Delete conversation: ' + conversation.title"
              (click)="deleted.emit(conversation.id)"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m-9 0l1 14h8l1-14M10 11v6M14 11v6" /></svg>
            </button>
          </li>
        }
      </ul>
    }
  </div>
</nav>
